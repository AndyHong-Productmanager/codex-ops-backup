<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" role="img"><title>명칭과 증거의 연결</title><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#17212B;font-size:17px}.small{font-size:14px;fill:#5D6770}.head{font-size:21px;font-weight:700}rect{fill:#F8F7F3;stroke:#D6D3CA}line,path{stroke:#0B6E69;fill:none;stroke-width:2}</style><text x="25" y="34" class="head">명칭과 증거의 연결</text><rect x="25" y="65" width="245" height="70"/><text x="42" y="94">CBNX ASIA</text><text x="42" y="119" class="small">대표·JV 관계를 자칭 [S1,S7]</text><rect x="535" y="65" width="285" height="70"/><text x="550" y="94">CBNX GROUP LLC</text><text x="550" y="119" class="small">법적 승계 확인 필요 [S3]</text><line x1="270" y1="100" x2="535" y2="100" stroke-dasharray="7 5"/><text x="315" y="87" class="small">웹사이트의 관계 설명</text><rect x="25" y="203" width="245" height="90"/><text x="42" y="231">Carbonyx Inc.</text><text x="42" y="256" class="small">법원: Ardmore 제조</text><text x="42" y="279" class="small">[S8,S20]</text><rect x="293" y="203" width="245" height="90"/><text x="310" y="231">Carbonyx International</text><text x="310" y="256" class="small">GFEZ 투자협약 당사자 명칭</text><text x="310" y="279" class="small">[S18] · Inc. 동일성 미확인</text><rect x="560" y="203" width="260" height="90"/><text x="574" y="231">Carbonyx International</text><text x="574" y="254">USA, Inc.</text><text x="574" y="279" class="small">SEC 발행인 [S10]</text><text x="25" y="177" class="small">아래 명칭들은 개별 식별 대상이다. 서로의 지분·승계 연결선은 확정하지 않는다.</text><rect x="25" y="332" width="795" height="70"/><text x="42" y="360">현재 carbonyx.com: Carbonyx Minerals Inc. [S16,S17]</text><text x="42" y="385" class="small">Vancouver 사업자 소개를 역사적 Texas Carbonyx에 합산하지 않음</text><text x="25" y="430" class="small">범례: 점선 = 당사자 주장 · 상자 = 기록에서 구별되는 명칭 · 지분 관계도 아님</text></svg>