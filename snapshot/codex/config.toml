model = "gpt-5.6-sol"
model_context_window = 400000
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
network_access = "enabled"

[mcp_servers.bkit]
command = "node"
args = ["/home/ubuntuhong/.codex/.bkit-codex/packages/mcp-server/index.js"]
required = true
startup_timeout_sec = 10.0
tool_timeout_sec = 60.0

[mcp_servers.bkit.tools.bkit_analyze_prompt]
approval_mode = "approve"

[mcp_servers.bkit.tools.bkit_init]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[projects."/home/ubuntuhong"]
trust_level = "trusted"

[projects."/home/ubuntuhong/dev/design-package"]
trust_level = "trusted"

[plugins."canva@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[features]
unified_exec = true
child_agents_md = true
multi_agent = true
plugin_hooks = true
plugins = true
goals = true

